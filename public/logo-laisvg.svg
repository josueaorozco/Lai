<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean, scalable Italian-styled minimalist logo -->
  <rect x="70" y="70" width="360" height="360" fill="none" stroke="#2D2D2D" stroke-width="12" />
  
  <text x="250" y="240" dominant-baseline="middle" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="bold" fill="#2D2D2D" letter-spacing="12">LAI</text>
  
  <!-- Subtle line separator -->
  <line x1="140" y1="310" x2="360" y2="310" stroke="#2D2D2D" stroke-width="2" />
  
  <text x="250" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#2D2D2D" letter-spacing="6">LINGUA E ARTI</text>
  <text x="250" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#2D2D2D" letter-spacing="6">D'ITALIA</text>
</svg>
